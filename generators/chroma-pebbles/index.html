<meta charset="utf-8">

<meta name="viewport" content="width=device-width,initial-scale=1">
<style>

<div id="app">

<script>
"use strict";
/* ============================================================ shaders */

const VS = `#version 300 es
in vec2 aPos;
uniform vec2 uBBmin, uBBmax, uRes;
out vec2 vPx;
void main(){
  vec2 px = mix(uBBmin, uBBmax, aPos);
  vPx = px;
  gl_Position = vec4(px.x/uRes.x*2.0-1.0, 1.0-px.y/uRes.y*2.0, 0.0, 1.0);
}`;

const FS = `#version 300 es
precision highp float;
in vec2 vPx;
out vec4 oCol;

uniform vec2  uCenter, uAB;      // centre px, half-extents px
uniform float uRot;              // radians
uniform float uN;                // superellipse exponent
uniform vec4  uIrr;              // amp1, phase1, amp2, phase2
uniform float uH;                // crown height (units of b)
uniform vec2  uM;                // profile power   top / bottom
uniform vec2  uQ;                // rim falloff     top / bottom
uniform vec4  uSeam;             // pos, height, width, power
uniform float uSeamSoft;
uniform vec4  uWarp;             // amp, f1, f2, phase
uniform vec3  uLight;
uniform vec2  uBand;             // gamma, offset
uniform float uFlip;
uniform float uAO, uGrain, uSoft, uSpec, uSeed;
uniform sampler2D uLUT;

/* lowbias32 finalizer - a single multiply after the xor leaves the grain
   correlated row to row, which shows up as faint horizontal streaking */
uint avalanche(uint x){
  x ^= x >> 16; x *= 0x7feb352du;
  x ^= x >> 15; x *= 0x846ca68bu;
  x ^= x >> 16;
  return x;
}
float hash21(vec2 p){
  uint x = uint(max(p.x, 0.0)), y = uint(max(p.y, 0.0));
  uint n = avalanche(x ^ avalanche(y ^ 0x9e3779b9u));
  return float(n >> 8) * (1.0/16777216.0);      // 24 bits -> exact in float32
}

void main(){
  /* ---- into the pebble's local frame ---- */
  vec2 d = vPx - uCenter;
  float c = cos(-uRot), s = sin(-uRot);
  vec2 p  = vec2(c*d.x - s*d.y, s*d.x + c*d.y);
  vec2 uv = p / uAB;

  /* ---- superellipse field, wobbled for imperfection ---- */
  float phi = atan(uv.y, uv.x);
  float irr = 1.0 + uIrr.x*sin(2.0*phi + uIrr.y) + uIrr.z*sin(3.0*phi + uIrr.w);
  irr = max(irr, 0.25);
  float ax = abs(uv.x), ay = abs(uv.y);
  float n  = uN;
  float ss = max(pow(ax, n) + pow(ay, n), 1e-7);
  float R  = pow(ss, 1.0/n);
  float r  = R / irr;

  /* ---- analytic antialiased mask ---- */
  float w = max(fwidth(r), 1e-6) * (1.0 + uSoft*24.0);
  float mask = 1.0 - smoothstep(1.0 - w, 1.0 + w, r);
  if (mask <= 0.0015) discard;

  /* ---- gradient of the shape field, in units of b ---- */
  float cf = pow(ss, 1.0/n - 1.0);
  float ar = uAB.y / uAB.x;                       // b/a  -> anisotropy
  vec2 gr = cf * vec2(pow(ax, n-1.0)*sign(uv.x)*ar, pow(ay, n-1.0)*sign(uv.y));
  float gl = length(gr);
  if (gl > 8.0) gr *= 8.0/gl;

  /* ---- dome profile: h = H*(1-r^m)^q, asymmetric top/bottom ---- */
  float mix_ = smoothstep(-0.40, 0.40, uv.y);
  float m = mix(uM.x, uM.y, mix_);
  float q = mix(uQ.x, uQ.y, mix_);
  float rs = clamp(r, 0.0, 0.9997);
  float rm = pow(rs, m);
  float slope = -uH * q * m * pow(max(rs, 1e-4), m-1.0) * pow(max(1.0-rm, 1e-4), q-1.0);
  vec2 dh = slope * gr;

  /* ---- low frequency warp so the bands breathe like the reference ----
     scaled BY the dome slope: a fixed amplitude swamps the near-zero gradient at
     the apex and folds the iso-contours into closed blobs. relative keeps them
     as stripes that undulate, which is what the reference does. */
  float dmag = min(length(dh), 3.0);
  dh += uWarp.x * dmag * vec2(0.35*sin(uv.y*uWarp.z + uWarp.w),
                              sin(uv.x*uWarp.y + uWarp.w) + 0.45*sin(uv.y*uWarp.z*1.7 - uWarp.w));

  /* ---- seam: a ridge in the height field -> hard crease + crushed flanks ---- */
  if (uSeam.y > 0.0001){
    float sp = uSeam.x + uWarp.x*0.32*sin(uv.x*uWarp.y + uWarp.w);
    float ds = uv.y - sp;
    float ad = abs(ds) / max(uSeam.z, 1e-3);
    if (ad < 1.0){
      float pw = max(uSeam.w, 2.0);
      /* smooth sign: the crease flips over a few pixels instead of one, which is
         the difference between a hairline and a stair-step */
      float sgn = clamp(ds / max(uSeamSoft, 1e-4), -1.0, 1.0);
      dh.y += -uSeam.y * pw * pow(1.0-ad, pw-1.0) * sgn / max(uSeam.z, 1e-3);
    }
  }

  /* ---- normal, back to world orientation, y up ---- */
  vec2 nl = -dh;
  float c2 = cos(uRot), s2 = sin(uRot);
  vec2 nw = vec2(c2*nl.x - s2*nl.y, s2*nl.x + c2*nl.y);
  float L = length(nw);
  if (L > 16.0) nw *= 16.0/L;
  vec3 N = normalize(vec3(nw.x, -nw.y, 1.0));

  /* ---- the whole trick: ramp coordinate = normal, not position ---- */
  float t = clamp(0.5 + 0.5*dot(N, normalize(uLight)), 0.0, 1.0);
  t = clamp(pow(t, uBand.x) + uBand.y, 0.0, 1.0);
  if (uFlip > 0.5) t = 1.0 - t;

  float g = hash21(gl_FragCoord.xy + vec2(uSeed, uSeed*1.37));
  t = clamp(t + (g-0.5)*0.0035, 0.0, 1.0);          // dither out LUT banding

  vec3 col = texture(uLUT, vec2(t, 0.5)).rgb;
  col *= 1.0 - uAO * smoothstep(0.70, 1.0, r);      // rim occlusion
  if (uSpec > 0.0){
    col += uSpec * pow(max(dot(N, normalize(vec3(0.12, 0.55, 0.83))), 0.0), 26.0);
  }
  col += (g - 0.5) * uGrain;                        // film grain
  col = clamp(col, 0.0, 1.0);

  oCol = vec4(col*mask, mask);                      // premultiplied
}`;

/* ============================================================ gl setup */

const cv = document.getElementById('c');
const gl = cv.getContext('webgl2', {antialias:false, premultipliedAlpha:true, preserveDrawingBuffer:true});
if(!gl){ document.getElementById('err').style.display='grid'; throw new Error('no webgl2'); }

function sh(type, src){
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS));
gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog);
if(!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);

const quad = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, quad);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([0,0, 1,0, 0,1, 1,1]), gl.STATIC_DRAW);
const aPos = gl.getAttribLocation(prog, 'aPos');
gl.enableVertexAttribArray(aPos);
gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

const U = {};
for(const k of ['uBBmin','uBBmax','uRes','uCenter','uAB','uRot','uN','uIrr','uH','uM','uQ',
                'uSeam','uSeamSoft','uWarp','uLight','uBand','uFlip','uAO','uGrain','uSoft','uSpec','uSeed','uLUT'])
  U[k] = gl.getUniformLocation(prog, k);

gl.enable(gl.BLEND);
gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
gl.uniform1i(U.uLUT, 0);

/* ============================================================ colour */

const cl01 = v => v<0?0:v>1?1:v;
const s2l  = c => c<=0.04045 ? c/12.92 : Math.pow((c+0.055)/1.055, 2.4);
const l2s  = c => c<=0.0031308 ? c*12.92 : 1.055*Math.pow(c, 1/2.4) - 0.055;

function hexToOklab(hex){
  const h = hex.replace('#','');
  const R = s2l(parseInt(h.slice(0,2),16)/255),
        G = s2l(parseInt(h.slice(2,4),16)/255),
        B = s2l(parseInt(h.slice(4,6),16)/255);
  const l = Math.cbrt(0.4122214708*R + 0.5363325363*G + 0.0514459929*B);
  const m = Math.cbrt(0.2119034982*R + 0.6806995451*G + 0.1073969566*B);
  const s = Math.cbrt(0.0883024619*R + 0.2817188376*G + 0.6299787005*B);
  return [0.2104542553*l + 0.7936177850*m - 0.0040720468*s,
          1.9779984951*l - 2.4285922050*m + 0.4505937099*s,
          0.0259040371*l + 0.7827717662*m - 0.8086757660*s];
}
function oklabToLinear(L,a,b){
  const l_ = L + 0.3963377774*a + 0.2158037573*b,
        m_ = L - 0.1055613458*a - 0.0638541728*b,
        s_ = L - 0.0894841775*a - 1.2914855480*b;
  const l = l_*l_*l_, m = m_*m_*m_, s = s_*s_*s_;
  return [ 4.0767416621*l - 3.3077115913*m + 0.2309699292*s,
          -1.2684380046*l + 2.6097574011*m - 0.3413193965*s,
          -0.0041960863*l - 0.7034186147*m + 1.7076147010*s];
}
const EPS = 1/512;
const inGamut = c => c[0]>=-EPS && c[0]<=1+EPS && c[1]>=-EPS && c[1]<=1+EPS && c[2]>=-EPS && c[2]<=1+EPS;

/* hard-clipping a too-saturated colour flattens the gradient into a solid neon
   patch. walk the chroma down to the gamut boundary instead - keeps L and hue,
   keeps the ramp continuous. */
function oklabToRgb255(L,a,b){
  L = cl01(L);
  let c = oklabToLinear(L,a,b);
  if(!inGamut(c)){
    let lo = 0, hi = 1;
    for(let i=0;i<12;i++){
      const m = (lo+hi)/2;
      const t = oklabToLinear(L, a*m, b*m);
      if(inGamut(t)){ lo = m; c = t; } else hi = m;
    }
    if(lo === 0) c = oklabToLinear(L, 0, 0);
  }
  return [Math.round(cl01(l2s(cl01(c[0])))*255),
          Math.round(cl01(l2s(cl01(c[1])))*255),
          Math.round(cl01(l2s(cl01(c[2])))*255)];
}

/* every colour below is sampled off Jan's reference image. ramps read bottom rim
   (t=0) -> top rim (t=1). */
const REF = {
  red:'#ee2a22', red2:'#e23a22', redorange:'#ee4a24', orange:'#ee7a2a',
  amberorange:'#f0912e', amber:'#f0a93a', yellow:'#f5ce55', yellowgreen:'#b8ce3c',
  green:'#45a83a', teal:'#12796e', darkteal:'#1b4a44', cyan:'#2fa8e8',
  azure:'#2e7fd6', blue:'#2f63c8', purple:'#6b3aa8', violet:'#a93a93',
  pink:'#e14faf', maroon:'#4a1e14'
};
const PRESETS = {
  /* the reference's 2nd pebble: cyan crown, magenta crease, red, dark teal, green */
  'ref-cyan-red-green': [
    [0.00,REF.yellowgreen],[0.10,REF.green],[0.24,REF.darkteal],[0.34,REF.red2],
    [0.44,REF.violet],[0.50,REF.blue],[0.76,REF.azure],[1.00,REF.cyan]],
  /* its 3rd pebble: a full sweep, warm field below, cool crown, pink rim sliver */
  'ref-full-spectrum': [
    [0.00,REF.yellow],[0.09,REF.amber],[0.17,REF.orange],[0.28,REF.redorange],
    [0.46,REF.red2],[0.58,REF.purple],[0.70,REF.blue],[0.82,REF.green],
    [0.93,REF.cyan],[1.00,REF.pink]],
  /* its 4th pebble: the quiet warm one */
  'ref-warm-duo': [
    [0.00,REF.red],[0.32,REF.redorange],[0.66,REF.orange],[1.00,REF.amber]],
  /* its 1st pebble: green heart, red flanks, blue/magenta rim */
  'ref-green-heart': [
    [0.00,REF.red2],[0.13,REF.redorange],[0.33,REF.green],[0.60,REF.green],
    [0.79,REF.red2],[0.91,REF.blue],[1.00,REF.violet]],
  'ref-ice': [
    [0.00,REF.yellow],[0.14,REF.green],[0.30,REF.teal],[0.50,REF.blue],
    [0.62,REF.purple],[0.74,REF.red2],[0.90,REF.orange],[1.00,REF.yellow]]
};
/* stacking these four in order reproduces the reference stack top to bottom */
const REF_CYCLE = ['ref-green-heart','ref-cyan-red-green','ref-full-spectrum','ref-warm-duo'];
const PRESET_KEYS = Object.keys(PRESETS);

/* colour vocabulary lifted off the reference, in spectral order. generating a
   ramp = walking a slice of this wheel, which is what each pebble in the
   reference is - not a random colour pick. */
const POOL = [REF.red, REF.redorange, REF.orange, REF.amberorange, REF.amber,
              REF.yellow, REF.yellowgreen, REF.green, REF.teal, REF.cyan,
              REF.azure, REF.blue, REF.purple, REF.violet, REF.pink];
/* near-black darks crush into razor lines at a crease or rim. the reference's
   only shadow band is a dark TEAL at L~0.38 with real chroma - keep them there. */
const DARKS = [REF.darkteal, '#173a50', '#123a2a', '#1d2a52', '#14384c'];
const POOL_L = POOL.map(h => hexToOklab(h)[0]);

function randomRamp(rnd, P, noDark){
  const nS = Math.max(2, Math.round(lerp(Math.min(P.stopsMin,P.stopsMax), Math.max(P.stopsMin,P.stopsMax), rnd())));
  const dir = rnd()<0.5 ? -1 : 1;
  const wrap = i => ((i % POOL.length) + POOL.length) % POOL.length;
  const Lof  = i => POOL_L[wrap(i)];

  /* pick the spectral sweep, then BRIDGE any big lightness jump with the pool
     entries that sit between them. the reference steps through hue at roughly
     even lightness; a big L jump between neighbouring stops is what a crease or
     rim compresses into a razor, however wide the ramp looks in t. */
  const seq = [];
  let idx = Math.floor(rnd()*POOL.length);
  const darkAt = {};
  for(let i=0;i<nS;i++){
    if(!noDark && i>0 && i<nS-1 && rnd() < P.darkChance){ darkAt[seq.length] = true; seq.push(null); continue; }
    seq.push(idx);
    idx += dir * (1 + Math.floor(rnd()*3));
  }
  const cols = [], isDark = [], isLight = [];
  let lastIdx = null;
  for(let k=0;k<seq.length;k++){
    if(seq[k] === null){
      cols.push(DARKS[Math.floor(rnd()*DARKS.length)]);
      isDark.push(true); isLight.push(false);
      continue;                                  // a shadow band costs no hue travel
    }
    let target = seq[k];
    if(lastIdx !== null){
      let guard = 0;
      while(Math.abs(Lof(target) - Lof(lastIdx)) > 0.22 && Math.abs(target - lastIdx) > 1 && guard++ < 2){
        const mid = lastIdx + Math.sign(target - lastIdx) * Math.max(1, Math.round(Math.abs(target - lastIdx)/2));
        if(Lof(mid) > 0.78) break;               // no wide muddy band of pale yellow
        cols.push(POOL[wrap(mid)]); isDark.push(false); isLight.push(false);
        lastIdx = mid;
      }
    }
    cols.push(POOL[wrap(target)]); isDark.push(false); isLight.push(Lof(target) > 0.78);
    lastIdx = target;
  }
  const nStops = cols.length;
  /* the reference's light yellows only appear as slivers, never as fields - a
     broad one gamut-maps down to washed-out peach. darks get a width FLOOR: a
     narrow dark band lands as a 2px razor anywhere t moves fast (a crease, a
     rim), while the reference's dark teal is a wide, slow, deliberate band. */
  const Lval = cols.map(h => hexToOklab(h)[0]);
  const gaps = [];
  for(let i=0;i<nStops-1;i++){
    let g = Math.pow(rnd(), 1.7) + 0.10;
    if(isLight[i] || isLight[i+1]) g *= 0.45;
    if(isDark[i]  || isDark[i+1])  g = Math.max(g, 0.55);
    const dL = Math.abs(Lval[i+1] - Lval[i]);
    if(dL > 0.15) g = Math.max(g, 0.32 + dL*1.2);   // a lightness move needs room
    gaps.push(g);
  }
  const tot = gaps.reduce((a,b)=>a+b, 0) || 1;
  const stops = [];
  let acc = 0;
  for(let i=0;i<nStops;i++){
    let pos = acc/tot;
    /* crowd the chromatic stops toward both rims. the surface turns away fastest
       there, so clustered stops become the thin wrapped slivers the reference has
       around its edges, while the middle opens into one broad calm field. */
    const u = 2*pos - 1;
    pos = 0.5 + 0.5*Math.sign(u)*Math.pow(Math.abs(u), P.rimBias);
    /* ...except darks, pulled back to mid-face where t crawls */
    if(isDark[i]) pos = 0.5 + (pos - 0.5)*0.55;
    stops.push([pos, cols[i]]);
    if(i < nStops-1) acc += gaps[i];
  }
  stops.sort((A,B)=>A[0]-B[0]);
  return spaceStops(stops);
}

/* No two stops may sit closer than MIN_SEP. A collapsed gap is a hard step in the
   LUT, and no amount of surface smoothness hides it - it lands as a razor-thin
   line across the pebble. This is the guard, applied after every placement rule. */
const MIN_SEP = 0.038;
function spaceStops(stops){
  const n = stops.length;
  if(n < 2) return stops;
  stops[0][0] = 0;
  for(let i=1;i<n;i++) stops[i][0] = Math.max(stops[i][0], stops[i-1][0] + MIN_SEP);
  stops[n-1][0] = 1;
  for(let i=n-2;i>0;i--) stops[i][0] = Math.min(stops[i][0], stops[i+1][0] - MIN_SEP);
  for(let i=1;i<n-1;i++) stops[i][0] = Math.min(Math.max(stops[i][0], i*MIN_SEP), 1 - (n-1-i)*MIN_SEP);
  return stops;
}

function rampToLab(ramp, hueRot, chroma){
  const cs = Math.cos(hueRot), sn = Math.sin(hueRot);
  ramp = spaceStops(ramp.map(([pos, col])=>[pos, col]));
  return ramp.map(([pos, col])=>{
    let lab = Array.isArray(col) ? col.slice() : hexToOklab(col);
    let a = lab[1]*chroma, b = lab[2]*chroma;
    return [pos, [lab[0], a*cs - b*sn, a*sn + b*cs]];
  });
}

const LUTW = 1024;
function makeLUT(labStops){
  const px = new Uint8Array(LUTW*4);
  /* polar form keeps chroma up through every transition - the reference has no
     washed-out midpoints, only deliberate dark stops */
  const pol = labStops.map(([pos, l])=>{
    const C = Math.hypot(l[1], l[2]);
    return [pos, l[0], C, Math.atan2(l[2], l[1])];
  });
  for(let i=1;i<pol.length;i++){           // unroll hue along the shortest arc
    let d = pol[i][3] - pol[i-1][3];
    while(d >  Math.PI) d -= 2*Math.PI;
    while(d < -Math.PI) d += 2*Math.PI;
    pol[i][3] = pol[i-1][3] + d;
  }
  let k = 0;
  for(let i=0;i<LUTW;i++){
    const t = i/(LUTW-1);
    while(k < labStops.length-2 && t > labStops[k+1][0]) k++;
    const j = Math.min(k+1, labStops.length-1);
    const A = labStops[k], B = labStops[j];
    const span = Math.max(B[0]-A[0], 1e-6);
    let u = cl01((t-A[0])/span);
    u = u*u*(3-2*u);                                  // ease -> no visible facets at stops
    let L, a, b;
    if(P.mix === 'vivid'){
      const pA = pol[k], pB = pol[j];
      L = lerp(pA[1], pB[1], u);
      const C = lerp(pA[2], pB[2], u);
      let hA = pA[3], hB = pB[3];
      if(pA[2] < 0.02) hA = hB;                       // hue of a grey stop is meaningless
      if(pB[2] < 0.02) hB = hA;
      const h = lerp(hA, hB, u);
      a = Math.cos(h)*C; b = Math.sin(h)*C;
    } else {
      L = lerp(A[1][0], B[1][0], u);
      a = lerp(A[1][1], B[1][1], u);
      b = lerp(A[1][2], B[1][2], u);
    }
    const c = oklabToRgb255(L, a, b);
    px[i*4] = c[0]; px[i*4+1] = c[1]; px[i*4+2] = c[2]; px[i*4+3] = 255;
  }
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, LUTW, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, px);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return {tex, px};
}

/* ============================================================ helpers */

function lerp(a,b,t){ return a + (b-a)*t; }
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a>>>15, 1 | a);
    t = t + Math.imul(t ^ t>>>7, 61 | t) ^ t;
    return ((t ^ t>>>14) >>> 0) / 4294967296;
  };
}
const hex2rgb = h => [parseInt(h.slice(1,3),16)/255, parseInt(h.slice(3,5),16)/255, parseInt(h.slice(5,7),16)/255];

/* ============================================================ params */

const OV = new Map();          // per-pebble overrides
let pebbles = [], selected = -1, W = 1440, H = 1800;

function ov(i){
  if(!OV.has(i)) OV.set(i, {shape:0, pal:0, flip:false, seam:null, preset:null});
  return OV.get(i);
}

/* ============================================================ geometry */

function outline(pb, samples){
  const pts = new Float64Array(samples*2);
  const e = 2/pb.n, c = Math.cos(pb.rot), s = Math.sin(pb.rot);
  for(let i=0;i<samples;i++){
    const ph = i/samples*Math.PI*2, cp = Math.cos(ph), sp = Math.sin(ph);
    let u = Math.sign(cp)*Math.pow(Math.abs(cp), e);
    let v = Math.sign(sp)*Math.pow(Math.abs(sp), e);
    const phi = Math.atan2(v, u);
    const irr = 1 + pb.irr[0]*Math.sin(2*phi + pb.irr[1]) + pb.irr[2]*Math.sin(3*phi + pb.irr[3]);
    u *= irr; v *= irr;
    const x = u*pb.a, y = v*pb.b;
    pts[i*2]   = c*x - s*y;
    pts[i*2+1] = s*x + c*y;
  }
  return pts;
}

const COLS = 1400;
function profiles(pts, cx, x0, dx){
  const top = new Float64Array(COLS).fill(Infinity);
  const bot = new Float64Array(COLS).fill(-Infinity);
  const n = pts.length/2;
  for(let i=0;i<n;i++){
    const j = (i+1)%n;
    const ax = pts[i*2]+cx, ay = pts[i*2+1], bx = pts[j*2]+cx, by = pts[j*2+1];
    let ia = Math.ceil((Math.min(ax,bx)-x0)/dx), ib = Math.floor((Math.max(ax,bx)-x0)/dx);
    if(ia<0) ia = 0; if(ib>COLS-1) ib = COLS-1;
    const span = bx-ax;
    for(let k=ia;k<=ib;k++){
      const x = x0 + k*dx;
      const t = Math.abs(span) < 1e-9 ? 0 : (x-ax)/span;
      const y = ay + (by-ay)*t;
      if(y < top[k]) top[k] = y;
      if(y > bot[k]) bot[k] = y;
    }
  }
  return {top, bot};
}

/* build the stack: every pebble slides up until it just kisses the one above */
function build(){
  const A = ASPECTS[P.aspect]; W = A[0]; H = A[1];
  for(const p of pebbles) if(p.lut) gl.deleteTexture(p.lut.tex);
  pebbles = [];

  const R = mulberry32(P.seed|0);
  const list = [];
  for(let i=0;i<P.count;i++){
    const o = ov(i);
    const r = mulberry32(((P.seed*73856093) ^ (i*19349663) ^ (o.shape*83492791)) | 0);
    const wf = lerp(Math.min(P.wMin,P.wMax), Math.max(P.wMin,P.wMax), r());
    const a  = W*wf/2;
    const b  = a*lerp(Math.min(P.flatMin,P.flatMax), Math.max(P.flatMin,P.flatMax), r());
    const pb = {
      i, a, b,
      n: lerp(Math.min(P.expMin,P.expMax), Math.max(P.expMin,P.expMax), r()),
      rot: (r()*2-1)*P.rot*Math.PI/180,
      irr: [(r()*2-1)*P.irr, r()*6.283, (r()*2-1)*P.irr*0.7, r()*6.283],
      cx: W/2 + (r()*2-1)*P.jitterX*W,
      lightA: P.lightA + (r()*2-1)*P.lightJit,
      bandG: Math.max(0.35, P.bandG*(1 + (r()*2-1)*P.bandJit)),
      bandOff: P.bandOff + (r()*2-1)*P.bandJit*0.14,
      mTop: P.mTop*(1+(r()*2-1)*0.16), qTop: P.qTop*(1+(r()*2-1)*0.14),
      mBot: P.mBot*(1+(r()*2-1)*0.16), qBot: P.qBot*(1+(r()*2-1)*0.14),
      H: P.H*(1+(r()*2-1)*0.10),
      warpF1: lerp(1.2, 3.4, r()), warpF2: lerp(1.4, 4.0, r()), warpPh: r()*6.283,
      seed: r()*512,
      flip: o.flip
    };
    const wantSeam = o.seam === null ? (r() < P.seamChance) : o.seam;
    pb.seam = wantSeam
      ? [P.seamPos + (r()*2-1)*P.seamPosJit, P.seamH*(1+(r()*2-1)*0.30), P.seamW*(1+(r()*2-1)*0.25), P.seamP]
      : [0,0,0.2,2.5];
    pb.seamSoft = P.seamSoft * (1.0 + 6.0*pb.seam[1]);

    /* palette */
    const pr = mulberry32(((P.seed*2654435761) ^ (i*40503) ^ (o.pal*22695477)) | 0);
    let ramp, verbatim = false;
    const key = o.preset || P.palette;
    if(key === 'reference'){
      ramp = PRESETS[REF_CYCLE[i % REF_CYCLE.length]];
      verbatim = true;                            // no hue jitter: reference as-is
    }
    else if(key === 'auto') ramp = randomRamp(pr, P, wantSeam);
    else ramp = PRESETS[key] || PRESETS[PRESET_KEYS[0]];
    const hueRot = verbatim ? 0 : (pr()*2-1)*P.hueJit*Math.PI/180;
    pb.labStops = rampToLab(ramp, hueRot, P.chroma);
    pb.lut = makeLUT(pb.labStops);
    list.push(pb);
  }

  /* ---- exact contact stacking over a shared skyline ---- */
  const x0 = -W*0.6, dx = (W*2.2)/(COLS-1);
  const sky = new Float64Array(COLS).fill(-Infinity);
  let first = true;
  for(const pb of list){
    const pf = profiles(outline(pb, 512), pb.cx, x0, dx);
    if(first){
      let mn = Infinity;
      for(let k=0;k<COLS;k++) if(pf.top[k] < mn) mn = pf.top[k];
      pb.cy = -mn;
      first = false;
    } else {
      let best = -Infinity;
      for(let k=0;k<COLS;k++){
        if(sky[k] === -Infinity || pf.top[k] === Infinity) continue;
        const gapK = sky[k] - pf.top[k];
        if(gapK > best) best = gapK;
      }
      if(!isFinite(best)){
        let mx = -Infinity;
        for(let k=0;k<COLS;k++) if(sky[k] > mx) mx = sky[k];
        let mn = Infinity;
        for(let k=0;k<COLS;k++) if(pf.top[k] < mn) mn = pf.top[k];
        best = mx - mn;
      }
      pb.cy = best + P.gap;
    }
    for(let k=0;k<COLS;k++){
      if(pf.bot[k] === -Infinity) continue;
      const y = pf.bot[k] + pb.cy;
      if(y > sky[k]) sky[k] = y;
    }
    pb.prof = pf;
  }

  /* ---- fit the stack into the frame ---- */
  let lo = Infinity, hi = -Infinity;
  for(const pb of list){
    for(let k=0;k<COLS;k++){
      if(pb.prof.top[k] !== Infinity)  lo = Math.min(lo, pb.prof.top[k] + pb.cy);
      if(pb.prof.bot[k] !== -Infinity) hi = Math.max(hi, pb.prof.bot[k] + pb.cy);
    }
  }
  const midY = (lo+hi)/2, z = P.zoom;
  for(const pb of list){
    pb.a *= z; pb.b *= z;
    pb.cx = W/2 + (pb.cx - W/2)*z;
    pb.cy = H/2 + (pb.cy - midY)*z + P.offY*H;
    pb.outlineW = outline(pb, 256);       // for hit testing, at final scale
  }
  pebbles = list;
}

/* ============================================================ render */

function render(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const stage = document.getElementById('stage');
  const maxW = stage.clientWidth - 52, maxH = stage.clientHeight - 52;
  const disp = Math.min(maxW/W, maxH/H);
  cv.style.width  = Math.round(W*disp) + 'px';
  cv.style.height = Math.round(H*disp) + 'px';
  draw(Math.round(W*disp*dpr), Math.round(H*disp*dpr));
  document.getElementById('dims').textContent = W + ' × ' + H + ' px at 1×';
}

function draw(pw, ph){
  cv.width = pw; cv.height = ph;
  gl.viewport(0, 0, pw, ph);
  const bg = hex2rgb(P.bg);
  gl.clearColor(bg[0], bg[1], bg[2], 1);
  gl.clear(gl.COLOR_BUFFER_BIT);

  gl.useProgram(prog);
  gl.bindBuffer(gl.ARRAY_BUFFER, quad);
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);
  gl.uniform2f(U.uRes, W, H);

  for(const pb of pebbles){
    const pad = Math.max(pb.a, pb.b)*0.10 + 4;
    const ex = Math.abs(pb.a*Math.cos(pb.rot)) + Math.abs(pb.b*Math.sin(pb.rot)) + pad;
    const ey = Math.abs(pb.a*Math.sin(pb.rot)) + Math.abs(pb.b*Math.cos(pb.rot)) + pad;
    gl.uniform2f(U.uBBmin, pb.cx-ex, pb.cy-ey);
    gl.uniform2f(U.uBBmax, pb.cx+ex, pb.cy+ey);
    gl.uniform2f(U.uCenter, pb.cx, pb.cy);
    gl.uniform2f(U.uAB, pb.a, pb.b);
    gl.uniform1f(U.uRot, pb.rot);
    gl.uniform1f(U.uN, pb.n);
    gl.uniform4f(U.uIrr, pb.irr[0], pb.irr[1], pb.irr[2], pb.irr[3]);
    gl.uniform1f(U.uH, pb.H);
    gl.uniform2f(U.uM, pb.mTop, pb.mBot);
    gl.uniform2f(U.uQ, Math.min(pb.qTop,0.98), Math.min(pb.qBot,0.98));
    gl.uniform4f(U.uSeam, pb.seam[0], pb.seam[1], pb.seam[2], pb.seam[3]);
    gl.uniform1f(U.uSeamSoft, pb.seamSoft);
    gl.uniform4f(U.uWarp, P.warp, pb.warpF1, pb.warpF2, pb.warpPh);
    const az = pb.lightA*Math.PI/180;
    gl.uniform3f(U.uLight, Math.cos(az), Math.sin(az), P.lightZ);
    gl.uniform2f(U.uBand, pb.bandG, pb.bandOff);
    gl.uniform1f(U.uFlip, pb.flip ? 1 : 0);
    gl.uniform1f(U.uAO, P.ao);
    gl.uniform1f(U.uGrain, P.grain);
    gl.uniform1f(U.uSoft, P.soft);
    gl.uniform1f(U.uSpec, P.spec);
    gl.uniform1f(U.uSeed, pb.seed);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, pb.lut.tex);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }
}

const panels = document.getElementById('panels');
const readouts = {};

function fmt(v, step){
  if(step >= 1) return String(Math.round(v));
  const d = step >= 0.1 ? 1 : step >= 0.01 ? 2 : 3;
  return v.toFixed(d);
}

/* selected-pebble panel */
const selFs = document.createElement('fieldset');
selFs.innerHTML = '<legend>Selected</legend><p class="sel" id="selTxt">click a pebble on the canvas</p>' +
  '<div id="swatch"></div>' +
  '<div class="btns"><button id="sShape">Shape</button><button id="sPal">Colours</button></div>' +
  '<div class="btns"><button id="sFlip">Flip ramp</button><button id="sSeam">Crease</button></div>';
panels.appendChild(selFs);

for(const [name, rows] of SPEC){
  const fs = document.createElement('fieldset');
  const lg = document.createElement('legend'); lg.textContent = name; fs.appendChild(lg);
  for(const row of rows){
    const [key, label, kind] = row;
    const d = document.createElement('div'); d.className = 'row';
    const l = document.createElement('label'); l.textContent = label; d.appendChild(l);
    if(kind === 'rng'){
      const [ , , , mn, mx, st] = row;
      const inp = document.createElement('input');
      inp.type = 'range'; inp.min = mn; inp.max = mx; inp.step = st; inp.value = P[key];
      const out = document.createElement('span'); out.className = 'val'; out.textContent = fmt(P[key], st);
      readouts[key] = [out, st];
      inp.addEventListener('input', ()=>{
        P[key] = parseFloat(inp.value);
        out.textContent = fmt(P[key], st);
        if(key === 'count') OV.clear();
        build(); render(); syncSel();
      });
      d.appendChild(inp); d.appendChild(out);
    } else if(kind === 'sel'){
      const inp = document.createElement('select');
      for(const o of row[3]){ const op = document.createElement('option'); op.value = o; op.textContent = o; inp.appendChild(op); }
      inp.value = P[key];
      inp.addEventListener('change', ()=>{
        P[key] = inp.value;
        if(key === 'palette') for(const [,o] of OV) o.preset = null;
        build(); render(); syncSel();
      });
      d.appendChild(inp);
    } else if(kind === 'col'){
      const inp = document.createElement('input');
      inp.type = 'color'; inp.value = P[key];
      inp.addEventListener('input', ()=>{ P[key] = inp.value; render(); });
      d.appendChild(inp);
    }
    fs.appendChild(d);
  }
  panels.appendChild(fs);
}

/* ---- selection ---- */
function inPoly(pts, x, y){
  let inside = false;
  const n = pts.length/2;
  for(let i=0, j=n-1; i<n; j=i++){
    const xi = pts[i*2], yi = pts[i*2+1], xj = pts[j*2], yj = pts[j*2+1];
    if(((yi>y) !== (yj>y)) && (x < (xj-xi)*(y-yi)/(yj-yi) + xi)) inside = !inside;
  }
  return inside;
}
cv.addEventListener('click', e=>{
  const r = cv.getBoundingClientRect();
  const x = (e.clientX-r.left)/r.width*W, y = (e.clientY-r.top)/r.height*H;
  selected = -1;
  for(let i=pebbles.length-1;i>=0;i--){
    const pb = pebbles[i];
    if(inPoly(pb.outlineW, x-pb.cx, y-pb.cy)){ selected = i; break; }
  }
  syncSel();
});

function syncSel(){
  const t = document.getElementById('selTxt'), sw = document.getElementById('swatch');
  if(selected < 0 || selected >= pebbles.length){
    selected = -1; t.textContent = 'click a pebble on the canvas'; sw.innerHTML = ''; return;
  }
  const pb = pebbles[selected], o = ov(selected);
  t.innerHTML = 'pebble <b>' + (selected+1) + '</b> · ' + Math.round(pb.a*2) + '×' + Math.round(pb.b*2) +
    ' · n ' + pb.n.toFixed(1) + (pb.seam[1] > 0 ? ' · crease' : '') + (o.flip ? ' · flipped' : '');
  sw.innerHTML = '';
  for(let i=0;i<24;i++){
    const px = pb.lut.px, k = Math.round(i/23*(LUTW-1))*4;
    const s = document.createElement('i');
    s.style.background = 'rgb(' + px[k] + ',' + px[k+1] + ',' + px[k+2] + ')';
    sw.appendChild(s);
  }
}
function bumpSel(f){
  if(selected < 0) return;
  f(ov(selected)); build(); render(); syncSel();
}
document.getElementById('sShape').onclick = ()=> bumpSel(o=>{ o.shape = (o.shape+1)*7919 & 0xffffff; });
document.getElementById('sPal').onclick   = ()=> bumpSel(o=>{ o.pal   = (o.pal+1)*6271 & 0xffffff; o.preset = null; });
document.getElementById('sFlip').onclick  = ()=> bumpSel(o=>{ o.flip = !o.flip; });
document.getElementById('sSeam').onclick  = ()=> bumpSel(o=>{
  o.seam = o.seam === null ? (pebbles[selected].seam[1] <= 0) : !o.seam;
});

/* ---- global buttons ---- */
document.getElementById('bRegen').onclick = ()=>{
  P.seed = (Math.random()*1e9)|0; OV.clear(); selected = -1; build(); render(); syncSel();
};
document.getElementById('bColors').onclick = ()=>{
  for(let i=0;i<P.count;i++){ const o = ov(i); o.pal = (Math.random()*1e6)|0; o.preset = null; }
  build(); render(); syncSel();
};
window.addEventListener('keydown', e=>{
  if(e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if(e.code === 'Space'){ e.preventDefault(); document.getElementById('bRegen').click(); }
  if(e.key === 'c') document.getElementById('bColors').click();
});

/* ---- export ---- */
for(const b of document.querySelectorAll('[data-x]')){
  b.onclick = ()=>{
    let x = parseInt(b.dataset.x, 10);
    const lim = gl.getParameter(gl.MAX_VIEWPORT_DIMS);
    const cap = Math.min(lim[0], lim[1], 16384);
    while(x > 1 && (W*x > cap || H*x > cap || W*x*H*x > 268435456)) x--;
    const wasW = cv.width, wasH = cv.height;
    draw(W*x, H*x);
    cv.toBlob(bl=>{
      const a = document.createElement('a');
      a.href = URL.createObjectURL(bl);
      a.download = 'chroma-pebbles-' + P.seed + '-' + x + 'x.png';
      a.click();
      setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
      draw(wasW, wasH);
    }, 'image/png');
  };
}

let rt;
window.addEventListener('resize', ()=>{ clearTimeout(rt); rt = setTimeout(render, 120); });

build(); render();
</script>
